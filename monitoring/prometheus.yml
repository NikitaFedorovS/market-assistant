global:
  scrape_interval: 10s
scrape_configs:
  - job_name: vllm            # vllm:kv_cache_usage_perc (gpu_cache_usage_perc in older vLLM), num_requests_running/waiting, TTFT, tokens/s
    static_configs: [{targets: ["vllm:8001"]}]
  - job_name: api             # assistant_* counters and latency histogram
    static_configs: [{targets: ["api:8000"]}]
