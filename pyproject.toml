[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "market-assistant"
version = "0.1.0"
description = "Marketplace support assistant: persona LoRA/QLoRA on Qwen2.5, hybrid RAG, tool-calling agent, vLLM serving"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 120
target-version = ["py310"]

[tool.ruff]
line-length = 120
target-version = "py310"
src = ["src", "app", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003", "E501"]  # Cyrillic/Uzbek letters are intentional; long phrase banks

[tool.ruff.lint.isort]
known-first-party = ["market_assistant", "app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-q"

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.File", "fastapi.Form", "typer.Option"]
