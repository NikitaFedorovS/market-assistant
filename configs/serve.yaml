llm:
  backend: openai                          # openai (vLLM) | transformers (local dev) | mock
  base_url: http://localhost:8001/v1       # vLLM OpenAI-compatible server
  api_key: EMPTY
  model: persona                           # LoRA module name registered in vLLM (--lora-modules)
  local_model: Qwen/Qwen2.5-0.5B-Instruct  # transformers backend
  local_adapter: null
  temperature: 0.3
  max_tokens: 512
  timeout_s: 60
agent:
  max_steps: 3
  confirm_tools: [create_return]
vllm:
  model: Qwen/Qwen2.5-7B-Instruct-AWQ
  quantization: awq
  lora_path: models/persona-lora
  max_loras: 4
  max_lora_rank: 16
  max_model_len: 8192
  gpu_memory_utilization: 0.85
  max_num_seqs: 64
  port: 8001
images:
  model: stabilityai/stable-diffusion-xl-base-1.0
  backend: diffusers                       # diffusers | comfyui
  comfyui_url: http://localhost:8188
  steps: 25
  guidance_scale: 6.0
  size: 1024
  max_concurrent: 1
  unload_after_s: 300
api:
  max_input_chars: 2000
  max_history_turns: 10
  request_timeout_s: 90
  rate_limit_per_min: 60
